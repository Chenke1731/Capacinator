# Layout audit（vlmkit 落地，2026-11-14）
# 定位：advisory 多页布局完整性体检，不是合并门禁。
# 触发：PR 改动 client/src/**（宽路径，避免漏跑）；每周一全量。
# 失败语义：findings 不失败；审计没跑成（服务/认证/浏览器/vlmkit）才失败。
name: layout-audit

on:
  pull_request:
    paths:
      - 'client/src/**'
      - 'docs/UI_GENERATION_CONTRACT.md'
      - 'scripts/audit-layout.mjs'
      - 'scripts/layout-audit.config.json'
      - 'scripts/layout-audit.allow.json'
      - 'scripts/check-layout-audit-map.mjs'
      - '.github/workflows/layout-audit.yml'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Layout audit map guard
        run: node scripts/check-layout-audit-map.mjs

      - name: Install vlmkit (pinned)
        run: npm install -g playwright@1.65.1 @mizchi/vlmkit@0.24.0

      - name: Install browsers (project + vlmkit)
        run: |
          if ! npx playwright install --with-deps chromium > /tmp/project-browser.log 2>&1; then
            MSG=$(tail -20 /tmp/project-browser.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=project playwright install failed::$MSG"
            exit 1
          fi
          if ! npx --yes playwright@1.65.1 install chromium > /tmp/vlmkit-browser.log 2>&1; then
            MSG=$(tail -20 /tmp/vlmkit-browser.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=vlmkit browser install failed::$MSG"
            exit 1
          fi

      - name: Start isolated e2e stack
        run: |
          NODE_ENV=e2e PORT=3111 npx tsx src/server/index.ts > /tmp/layout-api.log 2>&1 &
          echo $! > /tmp/layout-api.pid
          VITE_E2E=1 PORT=3111 npx vite --config client-vite.config.ts --port 3122 --strictPort > /tmp/layout-web.log 2>&1 &
          echo $! > /tmp/layout-web.pid
          npx wait-on http://localhost:3111/api/health http://localhost:3122

      - name: Run layout audit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/audit-layout.mjs --changed --base "${{ github.event.pull_request.base.sha }}" --base-url http://localhost:3122 --api-url http://localhost:3111 --out tmp/layout-audit
          elif [ "${{ github.event_name }}" = "push" ]; then
            node scripts/audit-layout.mjs --changed --base "${{ github.event.before }}" --base-url http://localhost:3122 --api-url http://localhost:3111 --out tmp/layout-audit
          else
            node scripts/audit-layout.mjs --all --base-url http://localhost:3122 --api-url http://localhost:3111 --out tmp/layout-audit
          fi

      # 确定性字号/标题守卫（页面审计 2026-11-14 沉淀）：违规即红，非 advisory
      - name: Typography guard
        run: node scripts/audit-typography.mjs --all --base-url http://localhost:3122 --api-url http://localhost:3111 --out tmp/typography-audit

      # 消费回路：findings 以 ::warning 注解进 PR checks（advisory 但可见）
      - name: Annotate findings
        if: always()
        run: |
          node -e "
          const fs=require('fs');
          let data;try{data=JSON.parse(fs.readFileSync('tmp/layout-audit/findings.json','utf8'))}catch{process.exit(0)}
          for(const f of (data.findings??[]).slice(0,10)){
            const msg=String(f.message??'').replace(/[\r\n|%]/g,' ').slice(0,120);
            console.log('::warning title=layout:'+f.rule+'::'+f.page+'@'+f.viewport+' '+msg);
          }
          "

      # 消费回路：PR 评论置顶 summary（同一条评论更新，不刷屏）
      - name: Post summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            try { summary = fs.readFileSync('tmp/layout-audit/summary.md', 'utf8'); } catch { return; }
            const body = '<!-- layout-audit -->\n## Layout audit（advisory）\n\n' + summary.slice(0, 5800);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100,
            });
            const marker = '<!-- layout-audit -->';
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Upload layout audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-audit-${{ github.run_id }}
          path: tmp/layout-audit
          retention-days: 14

      - name: Stop e2e stack
        if: always()
        run: |
          [ -f /tmp/layout-api.pid ] && kill "$(cat /tmp/layout-api.pid)" 2>/dev/null || true
          [ -f /tmp/layout-web.pid ] && kill "$(cat /tmp/layout-web.pid)" 2>/dev/null || true
